[package]
name = "tauri-plugin-llm"
version = "0.1.0"
authors = ["gilberto"]
description = "LLM local en el iPhone con llama.cpp para iOS Stats"
license = "MIT"
edition = "2021"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-llm"

[dependencies]
tauri = { version = "2.12.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.1", features = ["build"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
plist = "1"
