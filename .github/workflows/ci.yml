# CI — compile check (badge target for README)
#
# Not on every push. Day-to-day: local `cd src-tauri && cargo check`.
# Batch / overnight: python3 scripts/maybe_run_ci.py
#   (≥10 patches since last green CI, or release-due; max once/day)
# Manual: gh workflow run ci.yml --ref main
# GitHub UI: Actions → CI → Run workflow

name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync frontend into dist
        run: |
          chmod +x scripts/sync-dist.sh
          ./scripts/sync-dist.sh

      - name: cargo check
        working-directory: ./src-tauri
        run: cargo check --locked 2>/dev/null || cargo check
