# CI — compile check (badge target for README)
#
# Manual only: compile locally first (`cd src-tauri && cargo check`), then run
# this when you want a macOS Actions proof after a batch of changes:
#   gh workflow run ci.yml --ref main
# GitHub UI: Actions → CI → Run workflow

name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync frontend into dist
        run: |
          chmod +x scripts/sync-dist.sh
          ./scripts/sync-dist.sh

      - name: cargo check
        working-directory: ./src-tauri
        run: cargo check --locked 2>/dev/null || cargo check
