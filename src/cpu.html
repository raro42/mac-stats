<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPU</title>
    <script>
      (function () {
        const theme = localStorage.getItem("theme") || "apple";
        // Propagate ?v= so WKWebView does not keep a stale theme document after installs.
        const params = new URLSearchParams(window.location.search);
        const v = params.get("v") || String(Date.now());
        try {
          localStorage.setItem("macStatsAssetVersion", v);
        } catch (_) {}
        window.location.replace(
          `./themes/${theme}/cpu.html?v=${encodeURIComponent(v)}`
        );
      })();
    </script>
  </head>
  <body></body>
</html>
